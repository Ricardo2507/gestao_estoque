<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestão de Estoque{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard:home' %}">
            <i class="bi bi-box-seam"></i> Gestão de Estoque
        </a>

        <div class="d-flex gap-2">
            <a href="{% url 'dashboard:home' %}" class="btn btn-outline-light btn-sm">
                Painel Gerencial
            </a>

            <a href="{% url 'estoque_inteligente:relatorio_list' %}" class="btn btn-success btn-sm">
                Relatórios
            </a>

            <a href="{% url 'estoque_inteligente:relatorio_upload' %}" class="btn btn-primary btn-sm">
                Novo Upload
            </a>
        </div>
    </div>
</nav>

<main class="container-fluid px-4 mb-5">

    {% if messages %}
        {% for message in messages %}
            <div class="alert
                {% if message.tags == 'warning' %}alert-warning
                {% elif message.tags == 'error' %}alert-danger
                {% else %}alert-success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
