{% extends "base.html" %}

{% block content %}

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3">

    <div class="login-card w-100">

        <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="login-icon mx-auto mb-3">
                        <i class="bi bi-box-seam"></i>
                    </div>

                    <h2 class="fw-bold mb-1">
                        Gestão de Estoque
                    </h2>

                    <p class="text-muted mb-0">
                        Acesse sua conta para continuar
                    </p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger rounded-4 border-0">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        Usuário ou senha inválidos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Usuário
                        </label>

                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-person text-muted"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control border-start-0"
                                placeholder="Digite seu usuário"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Senha
                        </label>

                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control border-start-0"
                                placeholder="Digite sua senha"
                                required
                            >
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm"
                    >
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Entrar
                    </button>
                </form>

            </div>

        </div>

    </div>

</div>

<style>
    body {
        background:
            radial-gradient(circle at top left, rgba(13, 110, 253, 0.16), transparent 32%),
            linear-gradient(135deg, #f8f9fa 0%, #eef3f8 100%);
    }

    .login-card {
        max-width: 430px;
    }

    .login-icon {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d6efd, #6610f2);
        color: #fff;
        font-size: 2rem;
        box-shadow: 0 16px 35px rgba(13, 110, 253, 0.28);
    }

    .form-control,
    .input-group-text {
        border-color: #e5e7eb;
    }

    .form-control:focus {
        box-shadow: none;
        border-color: #0d6efd;
    }

    .input-group:focus-within .input-group-text {
        border-color: #0d6efd;
    }

    .btn-primary {
        background: linear-gradient(135deg, #0d6efd, #6610f2);
        border: none;
    }

    .btn-primary:hover {
        opacity: 0.92;
    }
</style>

{% endblock %}
