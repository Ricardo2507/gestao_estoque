<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar exclusao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h1 class="h5 mb-0">Confirmar exclusao do relatorio</h1>
                    </div>
                    <div class="card-body">
                        <p class="mb-3">Tem certeza que deseja excluir este relatorio?</p>
                        <ul class="mb-4">
                            <li><strong>Arquivo:</strong> {{ relatorio.nome_original }}</li>
                            <li><strong>Data de envio:</strong> {{ relatorio.criado_em|date:"d/m/Y H:i" }}</li>
                        </ul>
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-1"></i>
                                Confirmar exclusao
                            </button>
                            <a href="{% url 'estoque_inteligente:relatorio_list' %}" class="btn btn-secondary ms-2">
                                Cancelar
                            </a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
